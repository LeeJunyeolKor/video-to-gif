name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Set app version
        run: |
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Test
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Create checksum
        run: shasum -a 256 dist/VideoToGIF.zip > dist/VideoToGIF.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/VideoToGIF.zip dist/VideoToGIF.zip.sha256 --verify-tag --generate-notes
